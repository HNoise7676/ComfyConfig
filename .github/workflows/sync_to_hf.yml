name: Sync to Hugging Face
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tags.csv'
      - 'sw.js'
      - 'manifest.json'
      - 'icon-*.png'
  workflow_dispatch:

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: HNoise7676/Prompt_Writer
          repo_type: space
          space_sdk: static
          hf_token: ${{ secrets.HF_TOKEN }}
          include: |
            index.html
            tags.csv
            sw.js
            manifest.json
            icon-*.png
          delete_removed: false
